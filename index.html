<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text &amp; Hashtag Analyzer</title>
    <link rel="stylesheet" href="style.css?v=2" />
    <script src="script.js?v=4" defer></script>
  </head>
  <body>
    <main class="app">
      <h1>Text &amp; Hashtag Analyzer</h1>
      <p>Word count, character count, and estimated reading time update as you type.</p>

      <label for="text-input">Your text</label>
      <textarea id="text-input" rows="8" placeholder="Type or paste text here..."></textarea>

      <p id="word-count">Word count: 0</p>
      <p id="character-count">Character count: 0</p>
      <p id="reading-time">Estimated reading time: 0 min</p>

      <button id="summarize-button" type="button">Summarize</button>

      <section aria-labelledby="summary-heading">
        <h2 id="summary-heading">Summary</h2>
        <p id="summary-result" aria-live="polite">Enter at least two sentences, then select Summarize.</p>
      </section>
    </main>
  </body>
</html>
