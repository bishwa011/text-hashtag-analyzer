<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text &amp; Hashtag Analyzer</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <h1>Text &amp; Hashtag Analyzer</h1>
      <p>Enter some text to count its words.</p>

      <label for="text-input">Your text</label>
      <textarea id="text-input" rows="8" placeholder="Type or paste text here..."></textarea>

      <button id="count-button" type="button">Count words</button>
      <p id="result" aria-live="polite">Word count: 0</p>
    </main>
  </body>
</html>
